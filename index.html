    <style>
        /* 1. THE FOUNDATION */
        body {
            margin: 0;
            padding: 40px;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #000;
            /*animation: fadeIn 3s ease-out; /* Initial fade-in animation, taken out to improve snappiness */
        }

        header {
            text-align: center;
            margin-bottom: 80px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin: 0;
        }

        /* 2. THE CREATIVE GRID */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, 250px);
            justify-content: center;
            grid-auto-rows: 150px; /* Base height for rows */
            gap: 40px 100px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 3. IMAGE STYLING */
        .art-item {
            background-color: #ffffff; /* Placeholder color */
            border: 1px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.3s ease;
            --scale: 1; /* Default scale for non-hovered items */
            transform: scale(var(--scale)); /* Apply the scale variable for consistent scaling on hover */
        }

        .art-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

         .art-item:hover {
            transform: scale(calc(var(--scale) * 1.02)) translateY(-3px); /* Scales based on the defined variable (1.02) and adds a slight lift */
            cursor: crosshair; /* Changes cursor to crosshair for a more artistic feel */
            /*filter: invert(1);*/
            opacity: 0.8;  /* Adds a subtle fade effect on hover */
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); /* Adds a subtle shadow for depth */
            z-index: 1; /* Ensures the zoomed image sits on top of neighbors */
        }

        /* 4. VARYING THE SIZES (The "Creative Room") */
        .large { grid-row: span 2; grid-column: span 1; --scale: 1.3;}
        .huge { grid-row: span 4; grid-column: span 2;}
        .tall  { grid-row: span 4; }
        .wide  { grid-row: span 4; grid-column: span 4; }
        .small { grid-row: span 2; grid-column: span 1; }

        /* 5. TYPOGRAPHY IN BETWEEN */
        .text-break {
            grid-column: 1 / -1;  /*Spans the whole width */
            padding-top: 60px;
            padding-bottom: 80px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border-top: 2px solid #505050;
            margin-top: 100px;
        }
        /* 6. ANIMATION */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* 3. ACCESSIBILITY (Add this at the very end) */
        @media (prefers-reduced-motion: reduce) {
            body { animation: none; } /* */
        }

        /* mobile gallery: make every item uniform size */
        @media (max-width: 768px) {
            .text-break {
                padding-top: 20px;
                padding-bottom: 20px;
                margin-top: 40px;
            }

            .gallery {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 1px;
            }
            
            .gallery .art-item {
                flex: 1 1 calc(33.333% - 10px);
                max-width: calc(33.333% - 10px);
                background-color: #ffffff;
                border: none;
            }
            /* for rows with only two items, they will naturally take 50% each */
            .gallery .art-item:nth-last-child(2):first-child,
            .gallery .art-item:nth-last-child(2):first-child ~ .art-item {
                flex: 1 1 calc(50% - 10px);
                max-width: calc(50% - 10px);
            }
            /* For galleries with 3 items: 2 on top, 1 centered below */
            /* This selects all items in a gallery that has exactly 3 items */
            .gallery .art-item:first-child:nth-last-child(3),
            .gallery .art-item:first-child:nth-last-child(3) ~ .art-item {
                /* Set size to match 2-item galleries, but prevent growing to fill space on a new line */
                flex: 0 1 calc(50% - 10px);
                max-width: calc(50% - 10px);
            }
            /* Re-order items: 1st and 3rd on top row, 2nd on bottom row */
            .gallery .art-item:nth-child(1):nth-last-child(3) { order: 1; }
            .gallery .art-item:nth-child(3):nth-last-child(1) { order: 2; }
            .gallery .art-item:nth-child(2):nth-last-child(2) {
                order: 3;
                /*
                 * The item is now on a new line by itself. We manually center it.
                 * The calculation is roughly: (100% container - 50% item width) / 2 = 25%
                 */
                margin-left: calc(25% + 5px);
            }
            /* cancel any span classes and transforms */
            .gallery .large,
            .gallery .huge,
            .gallery .tall,
            .gallery .wide,
            .gallery .small {
                grid-row: span 1 !important;
                grid-column: span 1 !important;
                transform: none !important;
            }
            .gallery .art-item img {
                width: 100%;
                height: auto;
                object-fit: contain;
            }
            /* ensure anchors also center their contents */
            .gallery .art-item a {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                font-size: 0; /* Removes underline gap for image-only links */
            }
        }
    </style>
</head>

<script>
    function playFadeIn() {
        const body = document.body;
        body.style.animation = 'none'; // Kill any current animation
        void body.offsetWidth;         // Force the browser to "blink" (Reflow)
        body.style.animation = 'fadeIn 1.5s ease-out forwards'; /* Start fade-in animation */
    }

    // Handle initial load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', playFadeIn);
    } else {
        playFadeIn();
    }

    // Handle the "Back" button (BFCache)
    window.addEventListener('pageshow', function(event) {
        // event.persisted is true if the page was restored from cache (Back button)
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            playFadeIn();
        }
    });

    // Handle the "Fade Out" when leaving
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (link && link.href && !link.target) {
            const href = link.href;
            if (href.includes(window.location.origin) && href.endsWith('.html')) {
                e.preventDefault();
                document.body.style.animation = 'fadeOut 0.2s ease-in forwards'; /* Start fade-out animation */
                setTimeout(() => {
                    window.location.href = href; /* Navigate after fade-out completes */
                }, 200); 
            }
        }
    });
</script>
